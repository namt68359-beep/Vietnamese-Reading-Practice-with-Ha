<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vietnamese Reading Practice with Ha</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#fdf8f2;--card:#fff;--ink:#2d2a32;--muted:#6b6470;--accent:#c8553d;--soft:#f3e3d3;--green:#4a8c6a;--red:#b5483a;--line:#eadfd3}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans',system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;padding-top:env(safe-area-inset-top,0px)}
header{background:var(--accent);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header a{color:#fff;text-decoration:none;font-weight:700}
main{max-width:820px;margin:0 auto;padding:20px 20px 60px}
h1,h2,h3{line-height:1.3}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.lesson-tile{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit}
.num{width:46px;height:46px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:700;font-size:1.2rem;flex-shrink:0}
.tag{font-size:.82rem;color:var(--muted)}
.vi{font-size:1.25rem;font-weight:600}
.en{color:var(--muted);margin-top:4px}
.note{font-size:.9rem;color:var(--muted)}
.good{color:var(--green);font-weight:600}
.bad{color:var(--red);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.fb{margin-top:10px;line-height:1.8}
button{font:inherit;border:0;border-radius:10px;padding:8px 14px;background:var(--accent);color:#fff;cursor:pointer}
button.alt{background:var(--soft);color:var(--ink)}
button.ok{background:var(--green)}
button.on{background:var(--ink)}
button:disabled{opacity:.5;cursor:default}
input,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:8px;background:#fff}
.hl{background:#fbe3a6;border-radius:4px;padding:0 2px;cursor:pointer}
.brand{position:fixed;right:12px;bottom:8px;font-size:.78rem;color:var(--muted);background:rgba(253,248,242,.92);padding:2px 8px;border-radius:6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;background:var(--ink);color:#fff;padding:8px 14px;border-radius:10px;font-size:.9rem;max-width:90%}
[hidden]{display:none!important}
@media(max-width:600px){.vi{font-size:1.1rem}main{padding:14px 14px 60px}}
</style>
</head>
<body>
<header><a href="#home">Vietnamese Reading Practice with Ha</a><a href="#progress">My progress</a></header>
<main id="app"></main>
<div id="toast" hidden></div>
<div class="brand">Learn Vietnamese with Ha</div>

<script>
const LESSONS = [
{t:'My Girlfriend and Her Family',lv:'Beginner / A1',tp:'Bạn gái của tôi',
p:[["Tôi có một bạn gái người Việt Nam.","I have a Vietnamese girlfriend."],
["Cô ấy sống ở Hà Nội với gia đình.","She lives in Hanoi with her family."],
["Cô ấy có bố, mẹ và một em trai.","She has a father, a mother and a younger brother."],
["Cuối tuần, tôi thường gặp cô ấy.","At the weekend, I often see her."],
["Tôi muốn học tiếng Việt để nói chuyện với gia đình cô ấy.","I want to learn Vietnamese so that I can talk with her family."]],
v:[["bạn gái","girlfriend"],["sống","to live"],["gia đình","family"],["cuối tuần","weekend"],["gặp","to meet"],["nói chuyện","to talk"]],
qs:[{t:'mc',q:'Bạn gái của tôi là người nước nào?',en:'What nationality is my girlfriend?',o:['Người Việt Nam','Người Trung Quốc','Người Thái Lan','Người Hàn Quốc'],a:0,ex:'"người Việt Nam" means Vietnamese.'},
{t:'sa',q:'Cô ấy sống ở đâu?',en:'Where does she live?',k:['hà nội','ha noi','hanoi'],m:'Hà Nội (Hanoi), with her family.'},
{t:'sa',q:'Tại sao tôi muốn học tiếng Việt?',en:'Why do I want to learn Vietnamese?',k:['nói chuyện','gia đình','talk','family'],m:'To talk with her family.'},
{t:'tf',q:'Cô ấy có một em gái.',en:'She has a younger sister.',a:false,ex:'The passage says she has a younger brother (em trai).'}],
d:["Bạn có gia đình ở đâu?","Bạn muốn nói chuyện với ai bằng tiếng Việt?","Cuối tuần bạn thường làm gì?"],
dE:["Where does your family live?","Who would you like to talk to in Vietnamese?","What do you usually do at the weekend?"]},

{t:'My Daily Life',lv:'Beginner / A1',tp:'Cuộc sống hằng ngày',
p:[["Tôi sống ở Hà Nội.","I live in Hanoi."],
["Mỗi sáng, tôi thức dậy lúc bảy giờ.","Every morning, I wake up at seven o'clock."],
["Tôi ăn sáng và uống cà phê.","I have breakfast and drink coffee."],
["Buổi chiều, tôi đi làm.","In the afternoon, I go to work."],
["Buổi tối, tôi học tiếng Việt và gọi điện cho bạn gái.","In the evening, I study Vietnamese and call my girlfriend."]],
v:[["mỗi sáng","every morning"],["thức dậy","to wake up"],["ăn sáng","to have breakfast"],["đi làm","to go to work"],["buổi tối","evening"],["gọi điện","to call"]],
qs:[{t:'mc',q:'Tôi sống ở đâu?',en:'Where do I live?',o:['Hà Nội','Sài Gòn','Đà Nẵng','Huế'],a:0,ex:'Tôi sống ở Hà Nội.'},
{t:'sa',q:'Tôi thức dậy lúc mấy giờ?',en:'What time do I wake up?',k:['bảy','7','seven'],m:'Lúc bảy giờ (seven o\'clock).'},
{t:'sa',q:'Buổi tối, tôi làm gì?',en:'What do I do in the evening?',k:['học','gọi','study','call'],m:'Tôi học tiếng Việt và gọi điện cho bạn gái.'},
{t:'tf',q:'Tôi đi làm vào buổi sáng.',en:'I go to work in the morning.',a:false,ex:'The passage says buổi chiều (afternoon).'}],
d:["Mỗi sáng bạn thức dậy lúc mấy giờ?","Bạn thường ăn sáng gì?","Buổi tối bạn làm gì?"],
dE:["What time do you wake up every morning?","What do you usually have for breakfast?","What do you do in the evening?"]},

{t:'Meeting My Girlfriend’s Parents',lv:'A2',tp:'Lần đầu gặp bố mẹ bạn gái',
p:[["Tôi và bạn gái yêu nhau được hơn một năm, nhưng tôi chưa gặp bố mẹ cô ấy.","My girlfriend and I have been in love for more than a year, but I haven't met her parents yet."],
["Cuối tuần này, cô ấy muốn đưa tôi về nhà ăn cơm cùng gia đình.","This weekend, she wants to take me home to have a meal with her family."],
["Tôi hơi lo lắng vì mình không nói tiếng Việt tốt và sợ không hiểu mọi người nói gì.","I'm a bit nervous because I don't speak Vietnamese well and I'm afraid I won't understand what people say."],
["Bạn gái nói rằng bố mẹ cô ấy rất thân thiện và không yêu cầu tôi phải nói tiếng Việt hoàn hảo.","My girlfriend says her parents are very friendly and don't expect me to speak perfect Vietnamese."],
["Tôi quyết định học một số từ vựng về gia đình và luyện cách chào hỏi người lớn tuổi.","I've decided to learn some family vocabulary and practise how to greet older people."],
["Tôi hy vọng mình có thể nói chuyện với bố mẹ cô ấy và hiểu thêm về gia đình cô ấy.","I hope I can talk with her parents and understand her family better."]],
v:[["đưa ai về nhà","to take someone home"],["ăn cơm cùng gia đình","to have a meal with the family"],["lo lắng","worried"],["yêu cầu","to expect / to require"],["chào hỏi","to greet"],["người lớn tuổi","older people"]],
qs:[{t:'mc',q:'Tại sao tôi hơi lo lắng?',en:'Why am I a little worried?',o:["Tiếng Việt của tôi không tốt và tôi sợ không hiểu","Tôi không thích gia đình cô ấy","Tôi mệt vì công việc","Tôi không có tiền"],a:0,ex:'Because he does not speak Vietnamese well.'},
{t:'sa',q:'Bố mẹ bạn gái có yêu cầu tôi nói tiếng Việt hoàn hảo không?',en:'Do her parents expect me to speak perfect Vietnamese?',k:['không','khong','no','not'],m:'Không. They do not expect it.'},
{t:'sa',q:'Tôi chuẩn bị những gì trước khi gặp gia đình cô ấy?',en:'What do I prepare before meeting her family?',k:['từ vựng','tu vung','vocab','chào','chao','greet'],m:'Family vocabulary and how to greet older people.'},
{t:'tf',q:'Bạn gái nói rằng bố mẹ cô ấy rất thân thiện.',en:'His girlfriend says her parents are very friendly.',a:true,ex:'The passage says rất thân thiện (very friendly).'}],
d:["Bạn đã từng gặp gia đình của bạn bè chưa?","Bạn lo lắng điều gì khi gặp người mới?","Bạn sẽ chào bố mẹ người yêu thế nào?"],
dE:["Have you ever met a friend's family?","What do you worry about when you meet new people?","How would you greet your partner's parents?"]},

{t:'Vietnamese Family Forms of Address',lv:'A2',tp:'Cách xưng hô trong gia đình Việt Nam',
p:[["Khi sống ở Việt Nam, tôi nhận ra rằng cách xưng hô rất quan trọng trong giao tiếp.","While living in Vietnam, I realised that forms of address are very important in communication."],
["Người Việt thường gọi người khác bằng những từ như anh, chị, cô, chú hoặc bác, tùy theo tuổi tác và mối quan hệ.","Vietnamese people often address others with words like anh, chị, cô, chú or bác, depending on age and relationship."],
["Khi gặp bố mẹ bạn gái, tôi có thể gọi họ là cô và chú nếu gia đình cảm thấy cách gọi đó phù hợp.","When I meet my girlfriend's parents, I can call them cô and chú if the family feels that this is appropriate."],
["Người Việt cũng thường dùng từ “ạ” để thể hiện sự lễ phép với người lớn tuổi.","Vietnamese people also often use the word “ạ” to show respect to older people."],
["Ban đầu, tôi thấy những cách xưng hô này khá khó nhớ vì trong tiếng Anh, tôi thường chỉ dùng “you”.","At first, I found these forms of address quite hard to remember, because in English I usually only say “you”."],
["Tuy nhiên, khi hiểu cách sử dụng chúng, tôi có thể giao tiếp tự nhiên và lịch sự hơn.","However, once I understood how to use them, I could communicate more naturally and politely."]],
v:[["cách xưng hô","forms of address"],["tùy theo","depending on"],["tuổi tác","age"],["phù hợp","appropriate"],["thể hiện","to express"],["lễ phép","respectful"],["tự nhiên","natural"],["lịch sự","polite"]],
qs:[{t:'mc',q:'Từ “ạ” thể hiện điều gì?',en:'What does the word “ạ” express?',o:['Sự tôn trọng với người lớn tuổi','Sự tức giận','Sự ngạc nhiên','Niềm vui'],a:0,ex:'It shows politeness (lễ phép).'},
{t:'sa',q:'Tại sao người học thấy cách xưng hô khó nhớ?',en:'Why do learners find forms of address hard to remember?',k:['you','english','tiếng anh','tieng anh'],m:'Because in English they usually only use "you".'},
{t:'sa',q:'Khi gặp bố mẹ bạn gái, tôi có thể gọi họ là gì?',en:'What can I call her parents when I meet them?',k:['cô','chú'],m:'Cô and chú, if the family finds it appropriate.'},
{t:'tf',q:'Người Việt chỉ dùng từ “you” để gọi mọi người.',en:'Vietnamese people only use the word “you” to address everyone.',a:false,ex:'The passage lists anh, chị, cô, chú and bác.'}],
d:["Trong tiếng Anh, bạn gọi người lớn tuổi thế nào?","Bạn sẽ gọi bố mẹ người yêu là gì?","Bạn có dùng từ “ạ” khi nói chuyện không?"],
dE:["In English, how do you address older people?","What would you call your partner's parents?","Do you use the word “ạ” when you speak?"]},

{t:'A Family Meal in Northern Vietnam',lv:'A2',tp:'Một bữa cơm gia đình ở miền Bắc',
p:[["Trong nhiều gia đình miền Bắc, bữa cơm tối là thời gian mọi người ngồi lại và chia sẻ về một ngày của mình.","In many Northern Vietnamese families, dinner is a time when everyone sits together and shares about their day."],
["Các thành viên thường ăn cơm cùng nhau, hỏi thăm công việc và kể những câu chuyện trong cuộc sống.","Family members often eat together, ask about each other's work and tell stories about life."],
["Khi có khách đến nhà, gia đình có thể chuẩn bị thêm món ăn và mời khách dùng cơm.","When guests come to the house, the family may prepare extra dishes and invite them to eat."],
["Trước đây, tôi nghĩ rằng ăn cơm chỉ đơn giản là ăn uống, nhưng sau đó tôi hiểu rằng đây cũng là dịp để mọi người gần gũi nhau hơn.","I used to think eating a meal was simply about eating, but later I understood it is also an occasion for people to become closer."],
["Khi đến nhà bạn gái, tôi muốn tham gia bữa cơm gia đình và thử những món ăn do mẹ cô ấy nấu.","When I visit my girlfriend's home, I want to join the family meal and try the dishes her mother cooks."],
["Tôi nghĩ đây là một cách tốt để hiểu thêm về cuộc sống và văn hóa Việt Nam.","I think this is a good way to learn more about Vietnamese life and culture."]],
v:[["chia sẻ","to share"],["hỏi thăm","to ask about someone"],["chuẩn bị","to prepare"],["mời khách dùng cơm","to invite guests to eat"],["dịp","occasion"],["gần gũi","close"],["tham gia","to participate"],["món ăn","dish / food"]],
qs:[{t:'mc',q:'Bữa cơm tối có ý nghĩa gì trong nhiều gia đình miền Bắc?',en:'What does dinner mean in many Northern families?',o:['Thời gian ngồi lại và chia sẻ về một ngày','Chỉ là một bữa ăn nhanh','Một nghi lễ trang trọng','Thời gian để làm việc'],a:0,ex:'Everyone sits together and shares about their day.'},
{t:'sa',q:'Gia đình có thể làm gì khi có khách đến nhà?',en:'What can a family do when guests come?',k:['chuẩn bị','chuan bi','mời','moi','prepare','invite'],m:'Prepare extra dishes and invite them to eat.'},
{t:'sa',q:'Tôi muốn làm gì khi đến nhà bạn gái?',en:'What do I want to do when I visit my girlfriend’s home?',k:['tham gia','join','try'],m:'Join the family meal and try the dishes her mother cooks.'},
{t:'tf',q:'Trước đây, tôi nghĩ ăn cơm chỉ là ăn uống.',en:'I used to think eating a meal was only about eating.',a:true,ex:'The passage says this.'}],
d:["Gia đình bạn thường ăn tối lúc mấy giờ?","Bạn thích món ăn Việt Nam nào?","Khi có khách đến nhà bạn thì bạn làm gì?"],
dE:["What time does your family usually have dinner?","Which Vietnamese dish do you like?","What do you do when guests come to your home?"]}
];

const KEY='vi-ha-reading-progress';
const TTS=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);
let storageOK=true,P;
try{localStorage.setItem('vhtest','1');localStorage.removeItem('vhtest');P=JSON.parse(localStorage.getItem(KEY))||{};}catch(e){storageOK=false;P={};}
P=Object.assign({done:{},learned:[],quiz:{},write:{ok:0,tot:0},miss:{}},P);
function save(){if(!storageOK)return;try{localStorage.setItem(KEY,JSON.stringify(P));}catch(e){}}

let TAB='read',LI=0,VF='all',EX=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nrm=s=>s.normalize('NFC').toLowerCase().replace(/\s+/g,' ').trim();
const strip=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().replace(/\s+/g,' ').trim();
const clean=s=>nrm(s).replace(/[.,!?;:"“”'’()…]/g,'').replace(/\s+/g,' ').trim();
const has=(s,w)=>s.toLowerCase().includes(w.toLowerCase());
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function note(m){const e=$('#toast');e.textContent=m;e.hidden=false;clearTimeout(note.t);note.t=setTimeout(()=>e.hidden=true,3500);}
function speak(t){
  if(!TTS)return note('Audio is not supported in this browser.');
  const v=speechSynthesis.getVoices().find(x=>/^vi/i.test(x.lang));
  if(!v)return note('No Vietnamese voice is installed on this device, so audio cannot play.');
  const u=new SpeechSynthesisUtterance(t);u.lang='vi-VN';u.voice=v;u.rate=0.75;
  speechSynthesis.cancel();speechSynthesis.speak(u);
}
function spk(i,k){speak(LESSONS[i].p[k][0]);}
function spkw(j){speak(LESSONS[LI].v[j][0]);}

function exFor(L,w){let i=L.p.findIndex(s=>has(s[0],w[0]));if(i<0)i=L.p.findIndex(s=>has(s[0],w[0].split(' ')[0]));return i<0?null:i;}
function hl(s,L,k){let o=esc(s);L.v.forEach((w,j)=>{o=o.split(w[0]).join(`<span class="hl" onclick="wd(${j},${k})">${w[0]}</span>`);});return o;}

function render(){
  const h=location.hash;let html;
  if(h.startsWith('#lesson/')){LI=+h.split('/')[1];html=lesson(LI);}
  else if(h==='#progress')html=progress();
  else html=home();
  $('#app').innerHTML=html;window.scrollTo(0,0);
}
addEventListener('hashchange',()=>{TAB='read';VF='all';render();});

function home(){
  return `<h1>Vietnamese Reading Practice with Ha</h1>
  <p class="note">Five lessons, from easiest to hardest. Read the Vietnamese, check the English, then practise spelling and writing.</p>`+
  LESSONS.map((L,i)=>`<a href="#lesson/${i}" class="card lesson-tile"><div class="num">${i+1}</div><div><b>${L.t}</b> ${P.done[i]?'<span class="good">✓ Completed</span>':''}<div class="tag">${L.lv} · ${esc(L.tp)}</div></div></a>`).join('')+
  `<p><a href="#progress">View my progress →</a></p>`;
}

function lesson(i){
  const L=LESSONS[i];
  const tabs=[['read','Reading'],['vocab','Vocabulary'],['spell','Spelling & Writing'],['quiz','Quiz'],['talk','Discussion']];
  const body=TAB==='read'?readTab(i):TAB==='vocab'?vocabTab(i):TAB==='spell'?spellTab(i):TAB==='quiz'?quizTab(i):talkTab(i);
  return `<a href="#home">← All lessons</a>
  <div class="card" style="margin-top:10px"><div class="tag">Lesson ${i+1} · ${L.lv}</div><h2 style="margin:4px 0">${L.t}</h2><div class="note">${esc(L.tp)}</div></div>
  <div class="tabs">${tabs.map(([k,n])=>`<button class="${TAB===k?'on':'alt'}" onclick="setTab('${k}')">${n}</button>`).join('')}</div>
  <div id="tab">${body}</div>`;
}
function setTab(k){TAB=k;render();}
function setVF(f){VF=f;render();}

function readTab(i){
  const L=LESSONS[i];
  return `<div class="card" id="info"><span class="note">Tap a highlighted word to see its meaning, the sentence and its translation.</span></div>`+
  L.p.map((s,k)=>`<div class="card"><div class="vi">${hl(s[0],L,k)}</div>
  <div class="row"><button class="alt" onclick="tr(this,${k})">Show English Translation</button></div>
  <div class="en" id="tr${k}" hidden>${esc(s[1])}</div></div>`).join('')+
  '';
}
function tr(b,k){const e=document.getElementById('tr'+k);e.hidden=!e.hidden;b.textContent=e.hidden?'Show English Translation':'Hide English Translation';}
function wd(j,k){
  const L=LESSONS[LI],w=L.v[j];
  document.getElementById('info').innerHTML=`<div class="vi">${esc(w[0])} <span class="note">= ${esc(w[1])}</span></div>
  <div style="margin-top:8px">${esc(L.p[k][0])}</div><div class="en">${esc(L.p[k][1])}</div>`;
}

function vocabTab(i){
  const L=LESSONS[i];const n=L.v.filter(w=>P.learned.includes(w[0])).length;
  return `<p class="note">${n} of ${L.v.length} learned in this lesson.</p>
  <div class="row">${['all','new','learned'].map(f=>`<button class="${VF===f?'on':'alt'}" onclick="setVF('${f}')">${f==='all'?'All':f==='new'?'Not learned yet':'Learned'}</button>`).join('')}</div>`+
  L.v.map((w,j)=>{
    const lr=P.learned.includes(w[0]);
    if((VF==='new'&&lr)||(VF==='learned'&&!lr))return '';
    const e=exFor(L,w);
    return `<div class="card"><div class="vi">${esc(w[0])}</div><div>${esc(w[1])}</div>
    ${e!=null?`<div style="margin-top:8px">${esc(L.p[e][0])}</div><div class="en">${esc(L.p[e][1])}</div>`:''}
    <div class="row"><button class="${lr?'ok':'alt'}" onclick="mark('${w[0]}')">${lr?'✓ Learned (undo)':'Mark as Learned'}</button></div></div>`;
  }).join('');
}
function mark(v){const x=P.learned.indexOf(v);if(x>=0)P.learned.splice(x,1);else P.learned.push(v);save();render();}

function buildEx(L){
  const X=[];
  L.v.slice(0,3).forEach(w=>X.push({t:'word',p:strip(w[0]),e:w[0],g:w[1]}));
  L.v.filter(w=>L.p.some(s=>has(s[0],w[0]))).slice(0,2).forEach(w=>{
    const s=L.p.find(s=>has(s[0],w[0]))[0];
    X.push({t:'blank',p:s.replace(new RegExp(w[0],'i'),'______'),e:w[0],g:w[1]});
  });
  const tok=L.p[0][0].replace(/[.!?]$/,'').split(' ');
  X.push({t:'order',tok:shuffle(tok),e:L.p[0][0],chosen:[]});
  X.push({t:'copy',e:L.p[1][0]});
  return X;
}
function exHtml(x,k){
  const h=`<div class="card ex" data-k="${k}">`,end=`<div class="fb"></div></div>`;
  if(x.t==='order')return h+`<div class="tag">Put the words in order</div>
    <div class="chips">${x.tok.map(w=>`<button class="alt" data-w="${esc(w)}" onclick="pick(this)">${esc(w)}</button>`).join('')}</div>
    <div class="vi ans" style="min-height:1.8em"></div>
    <div class="row"><button onclick="chk(this)">Check</button><button class="alt" onclick="resetOrder(this)">Reset</button></div>`+end;
  const lab={word:'Complete the word (add the tone marks)',blank:'Complete the sentence',copy:'Copy the sentence exactly',listen:'Listen and type'}[x.t];
  const body=x.t==='word'?`<div>Without tone marks: <b>${esc(x.p)}</b></div><div class="en">${esc(x.g)}</div>`
   :x.t==='blank'?`<div class="vi">${esc(x.p)}</div><div class="en">Hint: ${esc(x.g)}</div>`
   :x.t==='copy'?`<div class="vi">${esc(x.e)}</div>`
   :'';
  return h+`<div class="tag">${lab}</div>${body}<input placeholder="Type in Vietnamese"><div class="row"><button onclick="chk(this)">Check</button></div>`+end;
}
function spellTab(i){
  EX=buildEx(LESSONS[i]);
  return `<p class="note">Type the Vietnamese exactly. A missing tone mark is different from a wrong letter, and each check tells you which one.</p>`+
  EX.map((x,k)=>exHtml(x,k)).join('');
}
function pick(b){const e=b.closest('.ex'),x=EX[+e.dataset.k];x.chosen.push(b.dataset.w);b.disabled=true;e.querySelector('.ans').textContent=x.chosen.join(' ');}
function resetOrder(b){const e=b.closest('.ex'),x=EX[+e.dataset.k];x.chosen=[];e.querySelectorAll('.chips button').forEach(c=>c.disabled=false);e.querySelector('.ans').textContent='';e.querySelector('.fb').innerHTML='';}
function dnotes(given,exp){
  const g=clean(given).split(' '),e=clean(exp).split(' ');let h='';
  e.forEach((w,i)=>{const x=g[i]||'';if(x===w)return;
    h+=`<div class="note">“${esc(w)}”: `+(strip(x)===strip(w)?'the letters are right, but a tone mark or diacritic is missing or wrong.':'check the letters, not only the tone marks.')+'</div>';});
  return h;
}
function chk(b){
  const e=b.closest('.ex'),x=EX[+e.dataset.k],f=e.querySelector('.fb');
  const g=x.t==='order'?x.chosen.join(' '):e.querySelector('input').value;
  const ok=clean(g)!==''&&clean(g)===clean(x.e);
  P.write.tot++;if(ok)P.write.ok++;else P.miss[x.e]=(P.miss[x.e]||0)+1;save();
  f.innerHTML=ok?'<span class="good">✓ Correct!</span>':`<span class="bad">Not quite.</span> Correct answer: <b>${esc(x.e)}</b>`+(x.t==='order'?'':dnotes(g,x.e));
}

function quizTab(i){
  const L=LESSONS[i];
  const allDone=L.qs.every((_,k)=>(i+'-'+k) in P.quiz);
  const sc=L.qs.map((_,k)=>i+'-'+k).filter(k=>k in P.quiz);
  const cor=sc.filter(k=>P.quiz[k]).length;
  return `<p class="note">${sc.length?`Score so far: ${cor} of ${sc.length} correct.`:'Answer each question to see whether you are right.'}</p>`+
  L.qs.map((q,k)=>{
    const key=i+'-'+k,done=key in P.quiz;
    const kind=q.t==='mc'?'Multiple choice':q.t==='tf'?'True or false':'Short answer';
    let h=`<div class="card"><div class="tag">Question ${k+1} · ${kind}</div><div><b>${esc(q.q)}</b></div>${q.en?`<div class="en">${esc(q.en)}</div>`:''}`;
    if(q.t==='mc')h+=`<div class="chips">${q.o.map((o,j)=>`<button class="alt" ${done?'disabled':''} onclick="qa(${i},${k},${j})">${esc(o)}</button>`).join('')}</div>`;
    else if(q.t==='tf')h+=`<div class="row"><button ${done?'disabled':''} onclick="qa(${i},${k},true)">Đúng</button><button class="alt" ${done?'disabled':''} onclick="qa(${i},${k},false)">Sai</button></div>`;
    else h+=`<input id="sa${k}" ${done?'disabled':''} placeholder="Type your answer"><div class="row"><button ${done?'disabled':''} onclick="qa(${i},${k},document.getElementById('sa${k}').value)">Check</button></div>`;
    if(done){
      h+=`<div class="fb">${P.quiz[key]?'<span class="good">✓ Correct!</span>':'<span class="bad">Not quite.</span>'} <b>Answer:</b> ${esc(ans(q))}${q.ex?`<div class="note">${esc(q.ex)}</div>`:''}</div>`;
    }
    return h+'</div>';
  }).join('')+
  (allDone?`<button class="alt" onclick="retry(${i})">Retry this quiz</button>`:'');
}
function ans(q){return q.t==='mc'?q.o[q.a]:q.t==='tf'?(q.a?'Đúng':'Sai'):q.m;}
function qa(i,k,v){
  const q=LESSONS[i].qs[k],key=i+'-'+k;if(key in P.quiz)return;
  let ok;
  if(q.t==='sa'){const s=strip(String(v));ok=s.length>0&&q.k.some(x=>s.includes(strip(x)));}
  else ok=v===q.a;
  P.quiz[key]=ok;
  if(LESSONS[i].qs.every((_,j)=>(i+'-'+j) in P.quiz))P.done[i]=true;
  save();render();
}
function retry(i){LESSONS[i].qs.forEach((_,k)=>delete P.quiz[i+'-'+k]);save();render();}

function talkTab(i){
  const L=LESSONS[i];
  return `<p class="note">Write short answers in Vietnamese. Use the starters and vocabulary hints if you need help. Your text is never replaced; the suggestion appears separately.</p>`+
  L.d.map((q,j)=>`<div class="card"><div class="vi">${esc(q)}</div><div class="en">${esc(L.dE[j])}</div>
  <div class="chips">${['Tôi ','Tôi thường ','Tôi không '].map(s=>`<button class="alt" onclick="starter(${j},'${s}')">${s.trim()}…</button>`).join('')}</div>
  <textarea id="d${j}" rows="2" placeholder="Write your answer"></textarea>
  <div class="row"><button onclick="fb2(${j})">Check my answer</button></div><div id="f${j}" class="fb"></div></div>`).join('')+
  `<div class="card note"><b>Vocabulary hints:</b> ${L.v.map(w=>`${esc(w[0])} = ${esc(w[1])}`).join(' · ')}</div>`;
}
function starter(j,s){const el=document.getElementById('d'+j);el.value=(el.value?el.value+' ':'')+s;el.focus();}
function fb2(j){
  const t=document.getElementById('d'+j).value.trim(),out=document.getElementById('f'+j);
  if(!t){out.innerHTML='<span class="bad">Please write an answer first.</span>';return;}
  const sug=(t.charAt(0).toUpperCase()+t.slice(1)).replace(/\s+/g,' ').replace(/([^.!?])$/,'$1.');
  const notes=[];
  if(t.charAt(0)!==t.charAt(0).toUpperCase())notes.push('Start the sentence with a capital letter.');
  if(!/[.!?]$/.test(t))notes.push('End the sentence with a full stop.');
  if(t.split(/\s+/).length<3)notes.push('Try a longer sentence with at least three words.');
  P.write.tot++;if(!notes.length)P.write.ok++;save();
  out.innerHTML=`<div>Your version: <i>${esc(t)}</i></div>`+(sug!==t?`<div>Suggested version: <b>${esc(sug)}</b></div>`:'')+
  notes.map(n=>`<div class="note">${n}</div>`).join('')+
  `<div class="note">${notes.length?'Good effort. Compare with the suggestion above.':'Good sentence structure.'} These are automatic checks only; ask a teacher or Vietnamese speaker for deeper grammar feedback.</div>`;
}

function progress(){
  const done=[0,1,2,3,4].filter(i=>P.done[i]).length;
  const tv=LESSONS.reduce((a,L)=>a+L.v.length,0);
  const qk=Object.keys(P.quiz),qc=qk.filter(k=>P.quiz[k]).length;
  const pct=qk.length?Math.round(qc/qk.length*100):0;
  const top=Object.entries(P.miss).sort((a,b)=>b[1]-a[1]).slice(0,8);
  return `<div class="card"><h2 style="margin-top:0">My progress</h2>
  <p>Lessons completed: <b>${done} of 5</b></p>
  <p>Vocabulary learned: <b>${P.learned.length} of ${tv}</b></p>
  <p>Reading comprehension: <b>${qc} of ${qk.length} correct${qk.length?` (${pct}%)`:''}</b></p>
  <p>Writing practice: <b>${P.write.ok} of ${P.write.tot} correct</b></p>
  <h3>Words you often misspell</h3>
  ${top.length?top.map(([w,n])=>`<div>${esc(w)} <span class="note">missed ${n} time${n>1?'s':''}</span></div>`).join(''):'<p class="note">No misspellings recorded yet.</p>'}
  </div>
  <p class="note">${storageOK?'Progress is saved in this browser.':'Browser storage is blocked here, so progress will only last until you close this page.'}</p>
  <button class="alt" onclick="resetP()">Reset progress</button>`;
}
function resetP(){if(!confirm('Reset all progress?'))return;P={done:{},learned:[],quiz:{},write:{ok:0,tot:0},miss:{}};save();render();}

render();
</script>
